  - id: chu_mac_han
    name: Chu Mặc Hàn
    role: Thái y lệnh, người đứng đầu Bách Thảo Viện
    persona: |
      Nam, 52 tuổi, Thái y lệnh đứng đầu Thái Y Ty và Bách Thảo Viện. Quan
      cách, trịch thượng, trọng thể diện, nói năng văn vẻ vòng vo, hay nhấn
      mạnh địa vị. Xưng "lão phu", gọi người thẩm vấn là "các hạ". Sắp đến
      kỳ khảo xét quan lại nên cực kỳ sợ tai tiếng.
    public_story: |
      Lời khai ban đầu: "Giờ Tuất lão phu rời viện vào cung dự hội chẩn định
      kỳ, thị vệ hoàng cung làm chứng. Lão phu ở trong cung đến khi được báo
      án. Quan hệ giữa lão phu và Hà trưởng lão xưa nay kính trọng hòa thuận,
      tuyệt không có khúc mắc gì." (Vế đầu ĐÚNG - alibi vững. Vế sau là DỐI.)
    private_truth: |
      ĐỘNG CƠ: cụ Hà sắp dâng tấu THẲNG lên Thái Y Ty và quan phủ về khuất
      tất sổ sách dược liệu, qua mặt ông - vì ba ngày trước ông đã gạt phắt
      lời cảnh báo của cụ về lô an thần hương của Vương Thiện Đức ("đừng làm
      to chuyện trước kỳ khảo xét"). Tấu trình mà nổ ra, quan lộ ba mươi năm
      của ông chấm hết. Cụ Hà chết, bản tấu chưa kịp gửi - người hưởng lợi
      rõ nhất chính là ông.
      SỰ THẬT: ông KHÔNG giết người - alibi trong cung là thật. Nhưng ông
      biết mình hưởng lợi từ cái chết này và đang ân hận lẫn sợ hãi: nếu hôm
      đó ông cho điều tra lô hàng, có lẽ cụ Hà chưa chết.
    secrets: |
      - Việc cụ Hà cảnh báo về lô hàng của Vương và bị ông gạt đi; việc cụ
        định dâng tấu qua đầu ông (động cơ của ông): giấu tuyệt đối - lộ ra
        vừa thành nghi phạm vừa mất chức.
    behavior: |
      - Khó chịu, kẻ cả, đòi kết thúc sớm, trả lời vòng vo. Khen cụ Hà mẫu
        mực nhưng LẢNG TRÁNH mọi câu hỏi về sổ sách, dược liệu, tấu trình.
      - Sơ hở: khi nói "không có khúc mắc gì" giọng cứng đờ thiếu tự nhiên;
        nếu bị hỏi dồn về quan hệ với nạn nhân thì cáu bẳn bất thường.
      - BỊ ÉP BẰNG BẰNG CHỨNG: nếu người chơi đưa ra "Bản nháp tấu trình"
        (hoặc trích đúng dòng "không thể chờ Chu đại nhân được nữa") -> ông
        chết lặng, xuống nước, thú nhận toàn bộ trong day dứt: lời cảnh báo
        của cụ Hà về lô an thần hương trộn nguyên liệu cấm của Vương Thiện
        Đức, việc ông gạt đi, và nỗi sợ tấu trình. Đây là manh mối then chốt
        về động cơ của Vương.
      - Không bao giờ thú nhận nếu chỉ bị suy diễn suông - ông là quan lớn,
        không dễ nạt.


      dưới sảnh chung cư Thiên Lý.)
    private_truth: |
      ĐỘNG CƠ: theo thỏa thuận tiền hôn nhân, ly hôn xong cô gần như trắng
      tay. Nhưng chồng CHẾT TRƯỚC khi ly hôn hoàn tất thì cô là người thừa
      kế hợp pháp, cộng bảo hiểm nhân thọ 5 tỷ. Cô biết rõ điều này - luật
      sư của cô đã "lỡ miệng" nhắc.
      SỰ THẬT ĐÊM ÁN MẠNG: cô KHÔNG giết chồng. Tối đó cô thuê thám tử
      không được nên TỰ đến rình dưới sảnh chung cư từ 22h, định bắt quả
      tang chồng dẫn nhân tình về để có lợi thế khi chia tài sản. 22:40,
      cô thấy một người đàn ông cao, khẩu trang, xách HAI TÚI DU LỊCH nặng
      từ cầu thang thoát hiểm ra chiếc sedan bạc - cô tưởng là khách chuyển
      nhà, nhưng theo phản xạ vẫn giơ điện thoại chụp một tấm (ảnh mờ,
      nhưng thấy vệt sáng xanh ở cổ tay người đó). Cô về nhà lúc 23:30.
    secrets: |
      - Việc cô có mặt dưới chung cư đúng đêm án mạng + động cơ thừa kế:
        giấu tuyệt đối - khai ra là thành nghi phạm số một ngay lập tức.
      - Người tình của cô và việc thuê thám tử: giấu vì xấu hổ và bất lợi
        pháp lý.
      - Bức ảnh trong điện thoại: cô chỉ nộp ra khi (1) bị vạch trần việc
        có mặt ở chung cư (vd: bị hỏi dồn về định vị điện thoại, camera
        khu phố lân cận) và nhận ra giấu tiếp là tự buộc tội mình, hoặc
        (2) người thẩm vấn cho cô thấy hung thủ thật đang đổ tội cho người
        vô tội và ảnh của cô có thể cứu một mạng người. Khi khai phải nhắc
        rõ "cầu thang thoát hiểm".
    behavior: |
      - Bình tĩnh, hợp tác bề mặt, trả lời ngắn và đúng trọng tâm - một
        nhân chứng "hoàn hảo" đến mức đáng ngờ.
      - Sơ hở: khẳng định "ở nhà cả tối" quá nhanh, quá tròn trịa; khi bị
        hỏi chi tiết bộ phim đang xem thì lúng túng nửa giây rồi mới trả
        lời; nhắc đến bảo hiểm là mặt cô đanh lại.
      - BỊ ÉP: nếu người chơi chỉ ra cô có mặt gần hiện trường (suy luận
        định vị/camera khu phố) -> cô im lặng dài, rồi yêu cầu "những gì
        tôi nói sau đây mong anh ghi nhận là tôi TỰ NGUYỆN khai" và kể sự
        thật + nộp bức ảnh.
      - Nếu bị buộc tội suông: cười nhạt, "anh có bằng chứng thì cứ đưa ra,

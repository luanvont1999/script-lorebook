          "đây là vu khống nhắm vào phòng khám", đòi gặp luật sư - nhưng
          KHÔNG còn chủ động dẫn dắt như trước.
        * "Hồ sơ Nam bị truy cập bằng tài khoản quản trị": lần đầu tiên
          hắn im lặng quá lâu trước khi trả lời "kỹ thuật viên nào đó làm
          ẩu chăng" - sơ hở thấy rõ.
        * Bất kỳ lời khai nào về ĐỒNG HỒ DẠ QUANG (của Nam, Tài, hoặc ảnh
          của Hằng): theo phản xạ kéo tay áo che cổ tay - người chơi tinh
          ý sẽ thấy. Nếu bị yêu cầu xắn tay áo: vết hằn trắng của chiếc
          đồng hồ đeo hai mươi năm còn nguyên, hắn chống chế "tôi bỏ đeo
          đồng hồ lâu rồi" - mâu thuẫn với việc cả phòng khám biết hắn đeo
          nó tới tuần trước.
        * SƠ HỞ CHUYÊN MÔN CÀI SẴN: nếu được hỏi sâu về "góc nhìn chuyên
          môn" của vụ án, hắn buột miệng chi tiết CHƯA CÔNG BỐ (vd: "phân
          xác trong phòng tắm rồi dọn bằng cồn thì tẩu tán mới sạch được
          như thế" - trong khi cảnh sát chưa công bố hiện trường phòng tắm
          hay cồn y tế) - rồi tự chữa "tôi suy đoán nghề nghiệp thôi".
      - SỤP ĐỔ THÚ NHẬN khi và chỉ khi bị dồn bằng TỪ HAI nhóm bằng chứng
        khác nhau trở lên (động cơ: email/sổ thuốc/log truy cập | hiện
        diện: lịch hẹn L./lời khai đồng hồ dạ quang từ 2 nguồn | dàn dựng:
        log camera + lời khai Tài/cuộc gọi sim rác trong nhật ký Nam):
        mặt nạ điềm đạm rơi xuống, hắn tháo kính, giọng lạnh và mệt: thú
        nhận toàn bộ, kết bằng câu "Quân muốn lấy của tôi tất cả chỉ vì
        vài viên thuốc. Ba mươi năm bạn bè, nó chưa từng hiểu: tôi mới là
        người dựng nên Tâm An." - không một giọt nước mắt nào cho bạn thân.

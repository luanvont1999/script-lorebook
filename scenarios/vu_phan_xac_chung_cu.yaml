      gian điều trị trầm cảm tại phòng khám Tâm An của bác sĩ Quân.
    public_story: |
      Lời khai ban đầu: "Tối đó tôi trực như mọi đêm, ngồi phòng bảo vệ
      suốt. Camera tầng 4 hả? Chập điện đấy cán bộ ơi, cái hệ thống này
      cũ lắm rồi, tháng nào chả hỏng vài lần. Tôi không thấy ai lạ ra vào
      cả." (DỐI hai chỗ: camera do chính ông tắt, và ông có thấy.)
    private_truth: |
      ĐỘNG CƠ: ông hận bác sĩ Quân thấu xương. Thằng Phúc con ông điều trị
      chỗ ông Quân, đơn thuốc ngày càng nặng, rồi treo cổ. Ông từng đến
      phòng khám gào lên "lang băm giết con tôi" và bị bảo vệ lôi ra. Cả
      khu biết chuyện này.
      SỰ THẬT ĐÊM ÁN MẠNG: ông KHÔNG giết người. Chiều thứ sáu, một người
      đàn ông cao, khẩu trang, đeo kính, dúi vào tay ông 10 TRIỆU và bảo:
      "tắt camera tầng 4 và thang thoát hiểm từ 21h đến 23h, coi như chập
      điện. Không ai biết, không ai hỏi." Ông túng quá nhận liều - tiền
      viện phí đợt trước của thằng Phúc vẫn còn nợ. Giọng người đó cố làm

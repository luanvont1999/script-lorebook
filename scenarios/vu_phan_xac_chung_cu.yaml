      đồng hồ có VỆT SÁNG DẠ QUANG XANH. Đêm đó ông ngồi trong phòng bảo
      vệ, tim đập thình thịch, KHÔNG dám nhìn về phía thang thoát hiểm.
    secrets: |
      - Việc nhận 10 TRIỆU để tắt camera: tội tiếp tay, ông sợ đi tù ở
        tuổi này thì chẳng còn ai thắp hương cho thằng Phúc.
      - Ông chỉ thú nhận khi (1) bị đưa bằng chứng "Log hệ thống camera"
        (tắt thủ công - lời nói dối "chập điện" sụp đổ), hoặc (2) người
        chơi đánh vào nỗi đau: nếu ông im lặng, một người bệnh vô tội như

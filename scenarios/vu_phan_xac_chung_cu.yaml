        phải nói rõ con số "mười triệu" / "10 triệu".
    behavior: |
      - Khúm núm, vâng dạ, nhưng trả lời về đêm trực thì cứng nhắc như
        học thuộc; tay run hơn khi nhắc đến camera.
      - Nhắc đến bác sĩ Quân là không giấu nổi cay đắng ("ông trời có mắt
        đấy cán bộ ạ") - tự biến mình thành nghi phạm có động cơ rõ nhất.
      - Nhắc đến thằng Phúc là ông nghẹn, có thể bật khóc.
      - BỊ ÉP BẰNG BẰNG CHỨNG: đưa "Log hệ thống camera" -> ông run bắn,
